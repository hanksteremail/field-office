    const ours  = flag.held && flag.held.team === t ? flag.held : null;
    for (const u of units){
      if (u.dead || u.team !== t) continue;
      if (u.carrying){ u.order = null; continue; }                          // it heads home by itself
      const go = thief || ours || flag;                                     // chase it, escort it, or fetch it
      const jx = ours ? rnd(-30, 30) : 0, jy = ours ? rnd(-30, 30) : 0;      // an escort walks alongside, not on top
      u.order = { type: 'move', x: go.x + jx, y: go.y + jy };
    }
  }
}

el('zoomout').onclick = () => { cam.zoom = clamp(cam.zoom / 1.3, fitZoom(), 2.2); clampCam(); };
function toggleFull(){
  const r = document.documentElement;
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl){
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    const req = r.requestFullscreen || r.webkitRequestFullscreen;
    if (req) req.call(r).catch(() => hideBars());
    else hideBars();                                   // no fullscreen API (some tablets): scroll the bars away
  }
  setTimeout(resize, 200);
}
// the tablet fallback: scroll the page a hair so the browser hides its own bars
function hideBars(){ window.scrollTo(0, 1); setTimeout(() => window.scrollTo(0, 1), 300); }
el('full').onclick = toggleFull;
el('fs').onclick = toggleFull;
// Auto-fill screen on load
window.addEventListener('load', () => { setTimeout(toggleFull, 100); });
document.addEventListener('fullscreenchange', () => {
  const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
  el('full').textContent = on ? 'Leave full screen' : 'Fill the screen';
  el('fs').textContent = on ? '✕' : '⛶';
  setTimeout(resize, 120);
});
document.addEventListener('webkitfullscreenchange', () => {
  const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
  el('fs').textContent = on ? '✕' : '⛶';
  setTimeout(resize, 120);
});
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const step = 60 / cam.zoom;
  if (k === 'arrowleft'  || k === 'a') cam.x -= step;
  if (k === 'arrowright' || k === 'd') cam.x += step;
  if (k === 'arrowup'    || k === 'w') cam.y -= step;
  if (k === 'arrowdown'  || k === 's') cam.y += step;
  if (k === 'escape'){ pending = null; sel = null; closeMenu(); }
  clampCam();
});

/* ---------------- the line along the bottom ---------------- */
function paintInfo(){
  if (winner){ el('info').textContent = TEAM_NAME[winner] + ' won. Press New game.'; return; }
  if (pending){ el('info').textContent = pending.type === 'route'
    ? 'Click each stop on the patrol route, in order.'
    : pending.type === 'wall' ? 'Click the two ends of the wall.'
    : pending.type === 'artyrow' ? (pending.pts.length ? 'Click the other end of the gun row.' : 'Click where the first gun goes.')
    : pending.type === 'shell-multi' ? 'Click target ' + (pending.pts.length + 1) + ' (or click "Fire all targets" when done).'
    : 'Now click the spot on the map.'; return; }
  if (sel && !sel.dead){
    let s = NAME[sel.kind] + '  ' + Math.ceil(sel.hp) + '/' + (sel.maxhp || '-') + ' life';
    if (sel.kind === 'jeep') s += '  ' + Math.floor(sel.bullets) + ' bullets  ' + Math.floor(sel.grenades) + ' grenades';
    if (sel.kind === 'tank') s += '  ' + Math.floor(sel.missiles) + ' missiles';
    if (sel.kind === 'artillery') s += '  ' + sel.rounds + ' rounds' + (sel.off > 0 ? '  cooling off' : '');
    else if (sel.plan) s += sel.planName === 'Gun row' ? '  building a gun row' : '  building a wall';
    if (sel.route) s += '  patrolling ' + sel.route.length + ' stops';
    else if (sel.kind !== 'artillery' && sel.kind !== 'factory' && !sel.order && !sel.guard) s += '  holding position';
    if (sel.kind === 'factory' && sel.batch) s += '  run ' + sel.batch.made + ' of ' + sel.batch.total;
    else if (sel.kind === 'factory' && !sel.queue) s += '  waiting for orders';
    if (sel.carrying) s += '  carrying the flag';
    el('info').textContent = s;
    return;
  }
  el('info').textContent = 'Click one of your ' + myTeam + ' units to give it an order. Drag the map to look around.';
}

/* ---------------- the main loop ---------------- */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000; last = now;
  dt = clamp(dt, 0, 0.05);                      // never a huge jump, and never backwards

  if (!paused){
    if (aiPlays) runAI(aiPlays, dt);
    stepFoot(dt);
    for (const u of units) if (!u.dead) stepUnit(u, dt);
    for (const b of builds) if (!b.dead) stepBuild(b, dt);
    stepShots(dt);
    if (units.some(u => u.dead) ) units = units.filter(u => !u.dead);
    if (builds.some(b => b.dead)) builds = builds.filter(b => !b.dead);
    group = group.filter(u => !u.dead);
    if (sel && sel.dead){ sel = group[0] || null; if (sel) openMenu(sel); else closeMenu(); }
  }
  draw();
  paintInfo();
  requestAnimationFrame(frame);
}

/* ---------------- upright screens ---------------- */
let uprightOK = false;
function checkTurn(){
  const narrow = innerWidth < 820 && innerHeight > innerWidth;
  el('turn').classList.toggle('show', narrow && !uprightOK);
}
el('anyway').onclick = () => { uprightOK = true; checkTurn(); setTimeout(resize, 60); };
addEventListener('orientationchange', () => setTimeout(() => { checkTurn(); resize(); }, 300));

addEventListener('resize', () => setTimeout(() => { checkTurn(); resize(); }, 60));
resize();
checkTurn();
cam.zoom = fitZoom();
newGame();
requestAnimationFrame(frame);

window.__ctf = { units: () => units, builds: () => builds, flag: () => flag, score: () => score,
                 sel: () => sel, set team(t){ myTeam = t; }, newGame };
</script>
